[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reldfs"
version = "1.0.0"
description = "Time-aware relational feature synthesis + LightGBM for RelBench (CPU-only, non-neural)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ken Wu", email = "wooqianghao@gmail.com" }]
keywords = ["relbench", "relational-learning", "feature-engineering", "lightgbm", "deep-feature-synthesis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The recorded numbers were produced with the exact versions in harness/requirements.txt.
dependencies = [
    "relbench==3.0.1",
    "lightgbm==4.7.0",
    "duckdb==1.5.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
test = ["pytest>=7"]
harness = ["huggingface_hub", "PyYAML"]

[project.urls]
Source = "https://github.com/KenWuqianghao/reldfs"
Benchmark = "https://github.com/stanford-star/relbench"

[project.scripts]
reldfs = "reldfs.cli:main"

[tool.setuptools]
packages = ["reldfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
